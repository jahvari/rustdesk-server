name: Merged shared-library validation
on:
  push:
    branches: [codex/validate-merged-library]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merged-library:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jahvari/hbb_common
          ref: de7073feb6fd63d346b5aa4058f84df804c40713
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libwayland-dev libxkbcommon-dev libx11-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: merged-current-hbb
      - name: Test fingerprint cache in merged library
        run: cargo test --lib fingerprint::tests::parallel_cache_reads_and_inserts_preserve_fingerprints --target x86_64-unknown-linux-gnu
      - name: Test maintained Linux users alias in merged library
        run: |
          mkdir -p tests
          test ! -e tests/merged_users_alias.rs
          cat > tests/merged_users_alias.rs <<'RS'
          #[test]
          fn maintained_users_alias_resolves_current_user() {
              use users::os::unix::UserExt;
              let uid = users::get_current_uid();
              let user = users::get_user_by_uid(uid).expect("runner user must exist");
              assert_eq!(user.uid(), uid);
              assert!(!user.home_dir().as_os_str().is_empty());
          }
          RS
          cargo test --test merged_users_alias --target x86_64-unknown-linux-gnu
